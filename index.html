<script type="text/babel">
const{useState,useEffect,useRef,useMemo}=React;
const Globe=window.Globe;

// ============ NEWS API CONFIG ============
// NewsAPI's free plan only allows browser (CORS) requests from localhost, so on
// GitHub Pages it always fails. Only try it locally; deployed sites go straight to RSS.
const NEWS_API_KEY = 'ff2b715299a74826b0da01866c40ef60';
const NEWS_API_URL = 'https://newsapi.org/v2/top-headlines?category=general&language=en&pageSize=30';
const IS_LOCAL = ['localhost', '127.0.0.1', ''].includes(location.hostname);

const RSS_FEEDS=[
{url:'https://feeds.bbci.co.uk/news/world/rss.xml',name:'BBC'},
{url:'https://rss.nytimes.com/services/xml/rss/nyt/World.xml',name:'NYT'},
{url:'https://www.aljazeera.com/xml/rss/all.xml',name:'Al Jazeera'},
{url:'https://feeds.npr.org/1001/rss.xml',name:'NPR'},
{url:'https://www.theguardian.com/world/rss',name:'Guardian'},
];

// rss2json returns pubDate as "YYYY-MM-DD HH:MM:SS" in UTC. new Date() reads that as
// local time (Chrome/Firefox) or Invalid Date (Safari), so normalise to ISO UTC first.
function parseDate(s) {
  if (!s) return new Date(NaN);
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(s)) s = s.replace(' ', 'T') + 'Z';
  return new Date(s);
}

const isRecent = (d, ms) => { const age = Date.now() - d.getTime(); return age >= 0 && age < ms; };

async function fetchNewsAPI() {
  if (!IS_LOCAL) return null;
  try {
    const res = await fetch(NEWS_API_URL, {
      headers: { 'X-Api-Key': NEWS_API_KEY },
      signal: AbortSignal.timeout(5000)
    });
    if (!res.ok) throw new Error('NewsAPI HTTP ' + res.status);
    const data = await res.json();
    if (data.status !== 'ok' || !data.articles) throw new Error('No articles');

    return {
      source: 'newsapi',
      items: data.articles.slice(0, 25).map(a => {
        const time = parseDate(a.publishedAt);
        return {
          id: 'na-' + a.url,
          title: a.title?.split(' - ')[0] || '',
          source: a.source?.name || 'News',
          url: a.url,
          time,
          isBreaking: isRecent(time, 1800000), // 30 min
          image: a.urlToImage,
        };
      }).filter(n => n.title && n.title.length > 10)
    };
  } catch (e) {
    console.log('NewsAPI error:', e.message);
    return null;
  }
}

async function fetchFeed(feed) {
  const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url), {
    signal: AbortSignal.timeout(6000)
  });
  if (!r.ok) throw new Error(feed.name + ' HTTP ' + r.status);
  const d = await r.json();
  if (d.status !== 'ok' || !d.items) throw new Error(feed.name + ': ' + (d.message || 'bad response'));
  return d.items.slice(0, 5).map(item => {
    const time = parseDate(item.pubDate);
    return {
      id: 'rss-' + (item.guid || item.link),
      title: item.title?.replace(/<[^>]+>/g, '').trim() || '',
      source: feed.name,
      url: item.link,
      time,
      isBreaking: isRecent(time, 3600000), // 1 hour
    };
  });
}

// Fetch all feeds in parallel so one slow/dead feed doesn't stall the rest
async function fetchRSSFeeds() {
  const results = await Promise.allSettled(RSS_FEEDS.map(fetchFeed));
  const all = [];
  results.forEach(r => r.status === 'fulfilled' ? all.push(...r.value) : console.log('RSS error:', r.reason?.message));
  const seen = new Set();
  return {
    source: 'rss',
    items: all
      .filter(n => n.title && n.title.length > 10 && !seen.has(n.id) && seen.add(n.id))
      .sort((a, b) => (b.time.getTime() || 0) - (a.time.getTime() || 0))
      .slice(0, 25)
  };
}

// Main news fetcher - NewsAPI on localhost, RSS everywhere else (and as fallback)
async function fetchNews() {
  const newsApi = await fetchNewsAPI();
  if (newsApi && newsApi.items.length > 0) {
    console.log('✓ NewsAPI: Got', newsApi.items.length, 'articles');
    return newsApi;
  }
  const rss = await fetchRSSFeeds();
  console.log('✓ RSS: Got', rss.items.length, 'articles');
  return rss;
}

//   {"updated":"<ISO time>","shops":[{"id":"dominos-pc","live":72,"typical":[24 hourly values 0-100]}]}

const PENTAGON = {lat:38.8719,lng:-77.0563};

{id:'papajohns-cc',name:"Papa John's",area:'Crystal City',dist:1.4,lat:38.8548,lng:-77.0497,open:10,close:25,lunch:45,dinner:75,late:40},
{id:'extreme-pr',name:'Extreme Pizza',area:'Pentagon Row',dist:0.8,lat:38.8631,lng:-77.0611,open:11,close:22,lunch:70,dinner:60,late:10},
{id:'wethepizza-pc',name:'We, The Pizza',area:'Pentagon City',dist:1.1,lat:38.8619,lng:-77.0577,open:11,close:23,lunch:60,dinner:70,late:20},
{id:'pizzato-arl',name:'Pizzato Pizza',area:'Arlington',dist:1.6,lat:38.8794,lng:-77.0921,open:11,close:24,lunch:35,dinner:55,late:30},
];

const DOUGHCON=[
null,
{lvl:1,name:'Maximum readiness',color:'#f8fafc'},
{lvl:2,name:'Next step to max readiness',color:'#ef4444'},
{lvl:3,name:'Increased force readiness',color:'#eab308'},

function surgeAt(t){
  const w=Math.floor(t/7200000),hr=Math.floor(t/3600000);
  const big=hash('surge'+w)<0.05?(0.6+1.4*hash('mag'+w))*Math.sin(Math.PI*(t%7200000)/7200000):0;
  const mild=hash('mild'+hr)<0.14?0.12+0.3*hash('mmag'+hr):0;
  return 1+Math.max(big,mild);
}

  const{h}=etTime(t);if(!isOpen(s,h))return null;
  const bucket=Math.floor(t/600000);
  const noise=0.82+0.36*hash(s.id+':'+bucket);
  const surge=surgeAt(t);
  return Math.min(100,typicalAt(s,h)*noise*surge+(surge-1)*18);
}

}

// Live prices over the CLOB market WebSocket. Calls onPrices({tokenId:{bid,ask,last}}) about once a second.
function useLivePrices(tokens,onPrices){
  const[status,setStatus]=useState('off');
  const cb=useRef(onPrices);cb.current=onPrices;
  const key=tokens.join(',');
  useEffect(()=>{
    if(!tokens.length||typeof WebSocket==='undefined')return;
    let ws,ping,flush,retry,dead=false,attempt=0;const book={},dirty=new Set();
    const set=(id,patch)=>{if(!id)return;book[id]={...book[id],...patch};dirty.add(id)};
    const handle=ev=>{
      if(!ev||typeof ev!=='object')return;
      const t=ev.event_type;
      if(t==='book'){const bids=(ev.bids||[]).map(x=>num(x.price)),asks=(ev.asks||[]).map(x=>num(x.price));set(ev.asset_id,{bid:bids.length?Math.max(...bids):0,ask:asks.length?Math.min(...asks):0})}
      else if(t==='price_change'){(ev.price_changes||[]).forEach(c=>{if(c.best_bid!=null||c.best_ask!=null)set(c.asset_id,{bid:num(c.best_bid),ask:num(c.best_ask)})})}
      else if(t==='best_bid_ask')set(ev.asset_id,{bid:num(ev.best_bid),ask:num(ev.best_ask)});
      else if(t==='last_trade_price')set(ev.asset_id,{last:num(ev.price)});
    };
    const connect=()=>{
      setStatus('connecting');ws=new WebSocket(CLOB_WS);
      ws.onopen=()=>{attempt=0;setStatus('live');ws.send(JSON.stringify({assets_ids:tokens,type:'market'}));ping=setInterval(()=>{if(ws.readyState===1)ws.send('PING')},10000)};
      ws.onmessage=m=>{if(typeof m.data!=='string'||m.data==='PONG')return;try{const d=JSON.parse(m.data);(Array.isArray(d)?d:[d]).forEach(handle)}catch(e){}};
      ws.onclose=()=>{clearInterval(ping);if(dead)return;setStatus('off');retry=setTimeout(connect,Math.min(30000,2000*2**attempt++))};
      ws.onerror=()=>ws.close();
    };
    connect();
    flush=setInterval(()=>{if(!dirty.size)return;const out={};dirty.forEach(id=>out[id]=book[id]);dirty.clear();cb.current(out)},1000);
    return()=>{dead=true;clearInterval(ping);clearInterval(flush);clearTimeout(retry);if(ws)ws.close()};
  },[key]);
  return status;
}

const tensionOf=m=>/ceasefire|peace|deal|truce/i.test(m.question)?1-m.probability:m.probability;

  const c=ms.filter(m=>m.category==='Conflict'||CONFLICT_RE.test(m.question));

  let w=0,s=0;c.forEach(m=>{const wt=Math.sqrt(Math.max(m.volume,1e4));w+=wt;s+=wt*tensionOf(m)});
  const drivers=[...c].sort((a,b)=>tensionOf(b)*Math.sqrt(b.volume)-tensionOf(a)*Math.sqrt(a.volume)).slice(0,4);
  return{score:Math.round(100*s/w),drivers,n:c.length};
}

function genArcs(ms,flows){
  const out=[],seen=new Set();
  ms.forEach(m=>(m.links||[]).forEach(l=>{const k=[m.country,l.country].sort().join('|');if(seen.has(k)||out.length>=40)return;seen.add(k);
    out.push({startLat:m.lat,startLng:m.lng,endLat:l.lat,endLng:l.lng,color:ARC_COLORS[m.category]||['rgba(59,130,246,0.7)','rgba(139,92,246,0.15)'],stroke:0.5+Math.min(m.vol24/2e6,1),dashLength:0.5,dashGap:0.15,dashAnimateTime:2000+out.length*137%1500,altitude:null})}));
  genArcsDC(ms.filter(m=>m.country!=='USA'&&!(m.links||[]).some(l=>l.country==='USA'))).forEach(a=>out.push(a));
  return out.concat(flows||[]);
}
function genArcsDC(ms){return ms.filter(m=>m.volume>1e6&&m.lat).slice(0,6).map((m,i)=>({startLat:PENTAGON.lat,startLng:PENTAGON.lng,endLat:m.lat,endLng:m.lng,color:m.category==='Conflict'?['rgba(249,115,22,0.75)','rgba(249,115,22,0.15)']:m.category==='Trump'?['rgba(239,68,68,0.7)','rgba(239,68,68,0.15)']:['rgba(59,130,246,0.7)','rgba(139,92,246,0.15)'],stroke:0.4,dashLength:0.3,dashGap:0.3,dashAnimateTime:2500+i*200,altitude:0.1+(i%3)*0.05}))}
function genRings(ms,hl,dc){const rs=ms.filter(m=>m.volume>2e6&&m.lat).slice(0,12).map((m,i)=>({lat:m.lat,lng:m.lng,maxR:2,propagationSpeed:1.5,repeatPeriod:1200+i*200,color:tensionOf(m)>0.5&&m.category==='Conflict'?'rgba(239,68,68,0.5)':'rgba(59,130,246,0.4)'}));rs.push({lat:PENTAGON.lat,lng:PENTAGON.lng,maxR:2+(5-dc)*1.5,propagationSpeed:1+(5-dc)*0.8,repeatPeriod:Math.max(400,1600-(5-dc)*300),color:DOUGHCON[dc].color});if(hl)rs.unshift({lat:hl.lat,lng:hl.lng,maxR:5,propagationSpeed:3,repeatPeriod:800,color:'rgba(255,255,255,0.6)'});return rs}
function genActs(ms){const a=[];const amts=[500,1000,2500,5000,10000,25000];for(let i=0;i<14;i++){const m=ms[Math.floor(Math.random()*Math.min(ms.length,15))];if(!m)continue;const amt=amts[Math.floor(Math.random()*amts.length)];a.push({id:'a-'+i,market:m.question,action:Math.random()<0.5?'BUY':'SELL',amount:amt,isWhale:amt>=10000,time:new Date(Date.now()-Math.random()*300000),source:m.source})}return a.sort((x,y)=>y.time-x.time)}

// ============ COMPONENTS ============
function Clock(){
  const[now,setNow]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(i)},[]);
  const f=tz=>now.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return<><div className="stat"><div className="stat-val mono">{f('America/New_York')}</div><div className="stat-lbl">Washington DC</div></div><div className="stat"><div className="stat-val mono">{f('UTC')}</div><div className="stat-lbl">Zulu</div></div></>;
}

// Popular-times style bars: typical busyness per hour, current hour shows live value
const HOURS=Array.from({length:24},(_,i)=>(i+6)%24); // 6am → 5am
function PopChart({shop,hour}){
  const[hov,setHov]=useState(null);
  const W=240,H=50,bw=8,gap=2,cur=Math.floor(hour);
  const st=SHOP_STATUS(shop.ratio);
  const y=v=>H-Math.max(v,0)/100*H;
  const read=hov!=null?hov:cur;
  const readTyp=Math.round(shop.curve[read]);
  return(<div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} role="img" aria-label={`${shop.name} busyness by hour`} onMouseLeave={()=>setHov(null)} style={{display:'block'}}>
      <line x1="0" x2={W} y1={H-0.5} y2={H-0.5} stroke="rgba(148,163,184,0.25)"/>
      {HOURS.map((h,i)=>{const x=i*(bw+gap);const typ=shop.curve[h];const isCur=h===cur;return(<g key={h}>
        {typ>0&&<path d={`M${x},${H} V${y(typ)+2} q0,-2 2,-2 h${bw-4} q2,0 2,2 V${H} Z`} fill={isCur?'rgba(148,163,184,0.18)':hov===h?'rgba(148,163,184,0.55)':'var(--track)'} stroke={isCur?'rgba(226,232,240,0.7)':'none'} strokeDasharray={isCur?'2 2':undefined}/>}
        {isCur&&shop.live!=null&&<path d={`M${x+1},${H} V${y(shop.live)+2} q0,-2 2,-2 h${bw-6} q2,0 2,2 V${H} Z`} fill={st.c}/>}
        <rect x={x-1} y="0" width={bw+gap} height={H} fill="transparent" onMouseEnter={()=>setHov(h)}/>
      </g>)})}
    </svg>
    <div className="axis"><span>6a</span><span>12p</span><span>6p</span><span>12a</span><span>5a</span></div>
    <div className="chart-readout">{fmtHour(read)}: usually {readTyp?readTyp+'% busy':'closed'}{read===cur&&shop.live!=null?` · now ${Math.round(shop.live)}%`:''}</div>
  </div>);
}

function Sparkline({data}){
  const[hov,setHov]=useState(null);
  if(!data||data.length<2)return null;
  const W=300,H=44,max=Math.max(2.4,...data.map(d=>d.index)),min=0.6;
  const x=i=>i/(data.length-1)*W,y=v=>H-4-(v-min)/(max-min)*(H-8);
  const pts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.index).toFixed(1)}`).join(' ');
  const thresholds=[1.15,1.4,1.75,2.2].filter(t=>t<max);
  const h=hov!=null?data[hov]:data[data.length-1];
  return(<div>
    <div className="spark-hd"><span>Index · last 24h</span><span className="mono">{new Date(h.t).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})} ET · {h.index.toFixed(2)}× · DOUGHCON {doughconFor(h.index)}</span></div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{display:'block'}} onMouseLeave={()=>setHov(null)}
      onMouseMove={e=>{const r=e.currentTarget.getBoundingClientRect();setHov(Math.max(0,Math.min(data.length-1,Math.round((e.clientX-r.left)/r.width*(data.length-1)))))}}>
      {thresholds.map(t=><line key={t} x1="0" x2={W} y1={y(t)} y2={y(t)} stroke="rgba(148,163,184,0.18)" strokeDasharray="3 3"/>)}
      <polyline points={pts} fill="none" stroke="#93c5fd" strokeWidth="2" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      {hov!=null&&<line x1={x(hov)} x2={x(hov)} y1="0" y2={H} stroke="rgba(226,232,240,0.4)"/>}
      <circle cx={x(hov??data.length-1)} cy={y(h.index)} r="4" fill="#93c5fd" stroke="#0f172a" strokeWidth="2"/>
    </svg>
  </div>);
}

// 7-day Yes price for the selected market
function PriceChart({data}){
  const[hov,setHov]=useState(null);
  if(!data)return<div className="chart-readout">Loading price history…</div>;
  if(data.length<2)return<div className="chart-readout">No price history available</div>;
  const W=340,H=70,ps=data.map(d=>d.p),lo=Math.max(0,Math.min(...ps)-0.03),hi=Math.min(1,Math.max(...ps)+0.03);
  const x=i=>i/(data.length-1)*W,y=v=>H-4-(v-lo)/(hi-lo||1)*(H-8);
  const pts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.p).toFixed(1)}`).join(' ');
  const i=hov??data.length-1,d=data[i],first=data[0].p,last=data[data.length-1].p;
  return(<div style={{marginTop:12}}>
    <div className="spark-hd"><span>Yes price · 7 days <span style={{color:last>=first?'var(--green)':'var(--red)'}}>{fmtChg(last-first)} pts</span></span><span className="mono">{new Date(d.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric'})} · {fmtCents(d.p)}</span></div>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{display:'block'}} onMouseLeave={()=>setHov(null)}
      onMouseMove={e=>{const r=e.currentTarget.getBoundingClientRect();setHov(Math.max(0,Math.min(data.length-1,Math.round((e.clientX-r.left)/r.width*(data.length-1)))))}}>
      <line x1="0" x2={W} y1={y(0.5)} y2={y(0.5)} stroke="rgba(148,163,184,0.18)" strokeDasharray="3 3"/>
      <polyline points={`0,${H} ${pts} ${W},${H}`} fill="rgba(147,197,253,0.08)" stroke="none"/>
      <polyline points={pts} fill="none" stroke="#93c5fd" strokeWidth="2" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
      {hov!=null&&<line x1={x(i)} x2={x(i)} y1="0" y2={H} stroke="rgba(226,232,240,0.4)"/>}
      <circle cx={x(i)} cy={y(d.p)} r="4" fill="#93c5fd" stroke="#0f172a" strokeWidth="2"/>
    </svg>
  </div>);
}

<div className="spot-dot"></div><span className="spot-lbl">SPOTLIGHT</span>
<span className="spot-txt">{highlighted.question}</span>
<span className="spot-prob" style={{color:highlighted.probability>=0.6?'var(--green)':highlighted.probability<=0.4?'var(--red)':'var(--yellow)'}}>{fmtProb(highlighted.probability)}</span>
</div>)}

{selected&&(
<div className="detail">
<div className="detail-hd"><div className="detail-q">{selected.question}</div><button className="detail-close" onClick={()=>setSelected(null)}>✕</button></div>
<div className="detail-stats">
<div className="detail-stat"><div className="detail-val" style={{color:selected.probability>=0.6?'var(--green)':selected.probability<=0.4?'var(--red)':'var(--yellow)'}}>{fmtProb(selected.probability)}</div><div className="detail-lbl">Yes</div></div>
<div className="detail-stat"><div className="detail-val">{fmtVol(selected.volume)}</div><div className="detail-lbl">Volume</div></div>
{selected.change24?<div className="detail-stat"><div className="detail-val mono" style={{color:selected.change24>0?'var(--green)':'var(--red)'}}>{fmtChg(selected.change24)}</div><div className="detail-lbl">24h pts</div></div>:null}
{selected.vol24?<div className="detail-stat"><div className="detail-val">{fmtVol(selected.vol24)}</div><div className="detail-lbl">24h Vol</div></div>:null}
<div className="detail-stat"><div className="detail-val">{selected.country}</div><div className="detail-lbl">Location</div></div>
</div>
{(selected.bid>0||selected.liquidity>0)&&<div className="shop-meta" style={{marginTop:8}}>{selected.bid>0&&<>Bid {fmtCents(selected.bid)} · Ask {fmtCents(selected.ask)} · </>}{selected.liquidity>0&&<>Liquidity {fmtVol(selected.liquidity)}</>}{selected.endDate&&<> · Ends {new Date(selected.endDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</>}</div>}
{selected.links?.length>0&&<div className="shop-meta" style={{marginTop:4}}>Connects {selected.country} ↔ {selected.links.map(l=>l.country).join(', ')}</div>}
{selected.tokenYes&&<PriceChart data={history&&(history.length?[...history,{t:Date.now(),p:selected.probability}]:history)}/>}
{selected.url&&<a href={selected.url} target="_blank" rel="noopener noreferrer" className="detail-link">View on Polymarket →</a>}
</div>)}

{gsize.w>0&&<Globe ref={globeEl} width={gsize.w} height={gsize.h} globeImageUrl="https://unpkg.com/three-globe/example/img/earth-night.jpg" bumpImageUrl="https://unpkg.com/three-globe/example/img/earth-topology.png" backgroundImageUrl="https://unpkg.com/three-globe/example/img/night-sky.png"
polygonsData={countries.features||[]} polygonCapColor={()=>'rgba(0,0,0,0)'} polygonSideColor={()=>'rgba(100,150,200,0.05)'} polygonStrokeColor={()=>'rgba(100,180,255,0.25)'} polygonAltitude={0.005}
pointsData={[...filtered,...shopPoints]} pointLat="lat" pointLng="lng"
pointAltitude={d=>d.isShop?0.01+(d.ratio||0)*0.02:Math.min(0.05+d.volume/50000000,0.18)}
pointRadius={d=>d.isShop?0.12:(selected?.id===d.id||highlighted?.id===d.id)?0.55:0.35}
pointColor={d=>d.isShop?SHOP_STATUS(d.ratio).c:d.category==='Conflict'?'#f97316':d.probability>=0.7?'#22c55e':d.probability>=0.4?'#eab308':'#ef4444'}
pointLabel={d=>d.isShop?'<div style="background:rgba(10,15,26,0.95);padding:8px 10px;border-radius:8px;border:1px solid rgba(59,130,246,0.3)"><div style="font-weight:700;color:white;font-size:11px">🍕 '+d.name+'</div><div style="color:#94a3b8;font-size:10px">'+SHOP_STATUS(d.ratio).t+(d.ratio!=null?' · '+Math.round(d.ratio*100)+'% of usual':'')+'</div></div>':'<div style="background:rgba(10,15,26,0.95);padding:10px;border-radius:8px;border:1px solid rgba(59,130,246,0.3);max-width:220px"><div style="font-size:9px;color:#60a5fa;margin-bottom:3px">'+d.source.toUpperCase()+' • '+d.country+'</div><div style="font-weight:600;color:white;margin-bottom:6px;font-size:11px">'+d.question+'</div><div style="display:flex;gap:12px"><div><div style="font-size:8px;color:#6b7280">YES</div><div style="color:#22c55e;font-weight:700">'+fmtProb(d.probability)+'</div></div><div><div style="font-size:8px;color:#6b7280">VOL</div><div style="color:white;font-weight:600">'+fmtVol(d.volume)+'</div></div></div></div>'}
onPointClick={d=>{if(!d.isShop)setSelected(d)}}
labelsData={[{lat:PENTAGON.lat,lng:PENTAGON.lng,text:'PENTAGON'}]} labelLat="lat" labelLng="lng" labelText="text" labelSize={0.6} labelDotRadius={0.25} labelColor={()=>DOUGHCON[dc].color} labelResolution={2}
arcsData={arcs} arcStartLat="startLat" arcStartLng="startLng" arcEndLat="endLat" arcEndLng="endLng" arcColor="color" arcAltitude="altitude" arcStroke="stroke" arcDashLength="dashLength" arcDashGap="dashGap" arcDashAnimateTime="dashAnimateTime"
ringsData={rings} ringLat="lat" ringLng="lng" ringMaxRadius="maxR" ringPropagationSpeed="propagationSpeed" ringRepeatPeriod="repeatPeriod" ringColor={d=>t=>{const c=d.color;return c.startsWith('#')?c+Math.round((1-t)*200).toString(16).padStart(2,'0'):c}}
atmosphereColor="#3b82f6" atmosphereAltitude={0.12}/>}
</main>

<aside className="right">
<div className="act-tabs">
<button className={`act-tab ${tab==='news'?'active':''}`} onClick={()=>setTab('news')}>📰 Intel Feed</button>
<button className={`act-tab ${tab==='markets'?'active':''}`} onClick={()=>setTab('markets')}>📊 Markets</button>
<button className={`act-tab ${tab==='activity'?'active':''}`} onClick={()=>setTab('activity')}>🔴 Flow{tradesLive&&whales.length>0&&<span className="badge" style={{marginLeft:4,background:'var(--yellow)',color:'#0a0f1a'}}>{whales.length}</span>}</button>
</div>
<div className="scroll">
{tab==='news'&&(<>
<div style={{padding:'0 2px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
<span className={`news-status ${newsSource==='rss'?'rss':''}`}>{newsSource==='newsapi'?'⚡ NewsAPI':newsSource==='rss'?'📡 RSS Feeds':'⏳ Connecting'}</span>
{newsLastUpd&&<span style={{fontSize:9,color:'var(--muted)'}}>Updated {fmtTime(newsLastUpd)}</span>}
</div>
{newsLoading?<div className="news-loading">⏳ Fetching live news...</div>:news.length===0?<div className="news-loading">No news available</div>:news.slice(0,20).map(n=>{const tg=newsTag(n.title);return(
<a key={n.id} href={n.url} target="_blank" rel="noopener noreferrer" className={`news ${n.isBreaking?'breaking':''}`}>
<div className="news-src">{n.isBreaking&&<span className="dot red" style={{width:6,height:6}}></span>}{n.source}{tg&&<span className={`tag ${tg}`}>{tg}</span>}</div>
<div className="news-title">{n.title}</div>
<div className="news-time">{fmtTime(n.time)}</div>
</a>)})}
</>)}
{tab==='markets'&&(<>
<div className="tabs">{cats.map(c=><button key={c} className={`tab ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}</div>
{filtered.slice(0,40).map(m=>(
<div key={m.id} className={`card ${selected?.id===m.id?'sel':''}`} onClick={()=>setSelected(m)}>
<div className="src">{m.source==='polymarket'?'◆ Polymarket':'◇ Manifold'} · {m.category}</div>
<div className="q">{m.question}</div>
<div className="row"><span><span key={m.flashAt||0} className={`prob ${m.probability>=0.7?'hi':m.probability>=0.4?'md':'lo'} ${m.flash&&Date.now()-m.flashAt<3000?'flash-'+m.flash:''}`}>{fmtProb(m.probability)}</span>{m.change24?<span className="mono" style={{fontSize:10,marginLeft:6,color:m.change24>0?'var(--green)':'var(--red)'}}>{fmtChg(m.change24)}</span>:null}</span><span className="vol">{m.vol24?fmtVol(m.vol24)+' 24h · ':''}{fmtVol(m.volume)}</span></div>
</div>))}
</>)}
{tab==='activity'&&(tradesLive?(<>
<div className="tabs"><button className={`tab ${!whaleOnly?'active':''}`} onClick={()=>setWhaleOnly(false)}>All ≥ $100</button><button className={`tab ${whaleOnly?'active':''}`} onClick={()=>setWhaleOnly(true)}>🐋 Whales ≥ {fmtVol(WHALE_USD)}</button></div>
<div className="note" style={{paddingTop:0}}>Live fills from the Polymarket Data API · refreshes every 15s</div>
{trades.filter(t=>!whaleOnly||t.usd>=WHALE_USD).slice(0,60).map(t=>{const m=markets.find(x=>x.conditionId===t.conditionId);return(
<div key={t.id} className={`act ${t.usd>=WHALE_USD?'whale':''}`} style={{cursor:m||t.url?'pointer':'default'}} onClick={()=>m?setSelected(m):t.url&&window.open(t.url,'_blank','noopener')}>
<span>{t.usd>=WHALE_USD?'🐋':t.side==='BUY'?'📈':'📉'}</span>
<div className="act-content"><div className="act-title">{t.title}</div><div className="act-meta"><span className={`act-amt ${t.side==='SELL'?'sell':'buy'}`}>{t.side} {t.outcome} @ {fmtCents(t.price)}</span> · {fmtVol(t.usd)} · {t.who}{m&&' · 🌐'}</div></div>
<span className="act-time">{fmtTime(t.time)}</span>
</div>)})}
</>):(<>
<div className="note" style={{paddingTop:0}}>{tradesLive===null?'⏳ Connecting to Polymarket trades…':'⚠ Polymarket trade feed unreachable — showing simulated flow for illustration, not real trades.'}</div>
{activities.map(a=>(
<div key={a.id} className={`act ${a.isWhale?'whale':''}`}>
<span>{a.isWhale?'🐋':a.action==='BUY'?'📈':'📉'}</span>
<div className="act-content"><div className="act-title">{a.market}</div><div className="act-meta"><span className={`act-amt ${a.action.toLowerCase()}`}>{a.action} ${a.amount.toLocaleString()}</span> • {a.source}</div></div>
<span className="act-time">{fmtTime(a.time)}</span>
</div>))}
</>))}
</div>
</aside>

<div className="ticker">
<span className="ticker-lbl"><span className="livedot"></span>BREAKING</span>
<div className="ticker-scroll">{ticker.map((t,i)=><span key={i} className="ticker-item">{t}</span>)}</div>
</div>
</div>
);
}

window.__booted=true;
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
